<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓储方 · 库存管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="仓储方-库存管理.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- ===== 左侧导航 ===== -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">仓储方</span>
            </div>
            <nav class="nav-menu">
                <div class="nav-item" onclick="location.href='仓储方-工作台.html'">
                    <span class="nav-label"><i class="fas fa-tachometer-alt" style="width:20px;"></i> 工作台</span>
                </div>
                <div class="nav-item" onclick="location.href='仓储方-仓单管理.html'">
                    <span class="nav-label"><i class="fas fa-file-invoice" style="width:20px;"></i> 仓单管理</span>
                </div>
                <div class="nav-item active" onclick="location.href='仓储方-库存管理.html'">
                    <span class="nav-label"><i class="fas fa-warehouse" style="width:20px;"></i> 库存管理</span>
                </div>
            </nav>
            <div class="nav-footer">
                <!-- ✅ 退出：清登录态，跳仓储方登录页 -->
                <div class="nav-item"
                    onclick="localStorage.removeItem('current_user'); localStorage.removeItem('token'); location.href='登录-仓储方.html'">
                    <span class="nav-label"><i class="fas fa-sign-out-alt" style="width:20px;"></i> 退出</span>
                </div>
            </div>
        </aside>

        <!-- ===== 右侧主内容 ===== -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <span class="page-title"></span>
                </div>
                <div class="top-bar-right">
                    <span class="company-name" id="companyName"></span>
                    <div class="notifications">
                        <span class="badge" id="notifBadge">0</span>
                        <i class="fas fa-bell"></i>
                    </div>
                    <button class="settings-btn" title="设置">
                        <div id="avatarText" onclick="location.href='设置.html'">⚙</div>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <!-- 搜索栏 -->
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder=" SKU / 货物品名 / 库位">
                    <select id="stockFilter">
                        <option value="">全部库存</option>
                        <option value="满仓">满仓</option>
                        <option value="正常">正常</option>
                        <option value="低库存">低库存</option>
                        <option value="缺货">缺货</option>
                    </select>
                    <select id="areaFilter">
                        <option value="">全部库区</option>
                        <option value="A">A区</option>
                        <option value="B">B区</option>
                        <option value="C">C区</option>
                        <option value="D">D区</option>
                    </select>
                    <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i> 搜索</button>
                </div>

                <!-- 统计卡片 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="statSku">--</div>
                        <div class="stat-label"><i class="fas fa-boxes stat-icon"></i>总库存SKU</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statTotal">--</div>
                        <div class="stat-label"><i class="fas fa-weight-hanging stat-icon"></i>总库存量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statLow" style="color:#f9a825;">--</div>
                        <div class="stat-label"><i class="fas fa-exclamation-triangle stat-icon"></i>低库存预警</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statUtil">--</div>
                        <div class="stat-label"><i class="fas fa-chart-pie stat-icon"></i>库位使用率</div>
                    </div>
                </div>

                <!-- 库存明细表 -->
                <div class="table-wrap">
                    <div class="table-title"><i class="fas fa-list"></i> 库存明细</div>
                    <table>
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>货物名称</th>
                                <th>库位</th>
                                <th>库存量</th>
                                <th>单位</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="7">
                                    <div class="loading-spinner">加载中...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="pagination">
                        <span>共 <span id="totalCount">0</span> 条</span>
                        <div class="page-btns">
                            <button class="btn-page" id="prevPage">上一页</button>
                            <span id="pageInfo" style="padding:4px 12px;">1 / 1</span>
                            <button class="btn-page" id="nextPage">下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="仓储方-库存管理.js"></script>
</body>

</html>
