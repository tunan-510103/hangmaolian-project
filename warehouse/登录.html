<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓储方登录</title>
    <script src="request.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #d5dde8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10), 0 8px 20px rgba(0, 0, 0, 0.04);
            padding: 2.5rem 2.5rem 2.8rem;
            width: 100%;
            max-width: 420px;
            transition: transform 0.2s;
        }

        .login-container:hover {
            transform: translateY(-2px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .role-badge {
            display: inline-block;
            background: #e8f2fb;
            color: #1f5f9e;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #0b1b2f;
            letter-spacing: -0.3px;
        }

        .login-header .subtitle {
            color: #6b7b8d;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 0.35rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #d9e1ea;
            border-radius: 12px;
            font-size: 0.95rem;
            background: #fafcfe;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #1f5f9e;
            box-shadow: 0 0 0 4px rgba(31, 95, 158, 0.10);
            background: #ffffff;
        }

        .form-group input::placeholder {
            color: #a9b9cc;
        }

        .form-group input.error {
            border-color: #dc3545;
            background: #fff8f8;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
        }

        .form-group .error-message {
            display: none;
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            padding-left: 0.3rem;
        }

        .form-group .error-message.show {
            display: block;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            text-align: center;
        }

        .btn-primary {
            background: #1f5f9e;
            color: white;
            box-shadow: 0 4px 12px rgba(31, 95, 158, 0.25);
        }

        .btn-primary:hover {
            background: #174a7a;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(31, 95, 158, 0.30);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            background: #9bb8d4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            margin-top: 1rem;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eef2f6;
            font-size: 0.9rem;
            color: #6b7b8d;
        }

        .login-footer a {
            color: #1f5f9e;
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.8rem 1.5rem 2rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>

</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="role-badge">仓储方入口</div>
            <h1>仓储方登录</h1>
            <div class="subtitle">登录以管理您的仓储业务</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginAccount">企业邮箱</label>
                <input type="email" id="loginAccount" placeholder="请输入企业邮箱" required>
                <div class="error-message" id="accountError">请输入企业邮箱</div>
            </div>

            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" required>
                <div class="error-message" id="passwordError">请输入密码</div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
            </div>

            <div id="loginMessage" class="message"></div>
        </form>
    </div>

    <script src="登录.js"></script>
</body>

</html>
