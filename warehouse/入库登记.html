<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航贸链 · 入库登记</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="入库登记.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>

    <div class="page-container">
        <!-- 顶部栏 -->
        <header class="top-bar">
            <div class="top-left">
                <button class="back-btn" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i> 返回
                </button>
                <h1 class="page-title"><i class="fas fa-arrow-down"></i> 入库登记</h1>
            </div>
        </header>

        <!-- 主体内容 -->
        <main class="main-content">

            <form id="inboundForm" novalidate>

                <!-- ===== 第一步：货物信息 ===== -->
                <section class="form-section">
                    <div class="section-header">
                        <h3><i class="fas fa-cube"></i> 货物信息</h3>
                        <span class="step-badge">步骤 1/4</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cargoName">货物名称 <span class="required">*</span></label>
                            <input type="text" id="cargoName" placeholder="如：电解铜" required>
                            <div class="error-msg">请输入货物名称</div>
                        </div>
                        <div class="form-group">
                            <label for="cargoSpec">规格型号 <span class="required">*</span></label>
                            <input type="text" id="cargoSpec" placeholder="如：Cu ≥ 99.95%" required>
                            <div class="error-msg">请输入规格型号</div>
                        </div>
                        <div class="form-group">
                            <label for="cargoQuantity">数量 <span class="required">*</span></label>
                            <input type="number" id="cargoQuantity" placeholder="如：200" min="1" step="1" required>
                            <div class="error-msg">请输入有效数量</div>
                        </div>
                        <div class="form-group">
                            <label for="cargoUnit">单位</label>
                            <select id="cargoUnit">
                                <option value="吨">吨 (t)</option>
                                <option value="千克" selected>千克 (kg)</option>
                                <option value="克">克 (g)</option>
                                <option value="件">件</option>
                                <option value="箱">箱</option>
                                <option value="块">块</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cargoWeight">单重 (kg) <span class="required">*</span></label>
                            <input type="number" id="cargoWeight" placeholder="如：25" min="0.1" step="0.1" required>
                            <div class="error-msg">请输入有效单重</div>
                        </div>
                        <div class="form-group">
                            <label for="cargoTotalWeight">总重 (kg)</label>
                            <input type="text" id="cargoTotalWeight" readonly placeholder="自动计算">
                        </div>
                    </div>
                </section>

                <!-- ===== 第二步：库位信息 ===== -->
                <section class="form-section">
                    <div class="section-header">
                        <h3><i class="fas fa-warehouse"></i> 库位信息</h3>
                        <span class="step-badge">步骤 2/4</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="storageArea">库区 <span class="required">*</span></label>
                            <select id="storageArea" required>
                                <option value="">请选择库区</option>
                                <option value="A">A区 - 有色金属</option>
                                <option value="B">B区 - 黑色金属</option>
                                <option value="C">C区 - 贵金属</option>
                                <option value="D">D区 - 稀有金属</option>
                                <option value="E">E区 - 合金材料</option>
                                <option value="F">F区 - 其他</option>
                            </select>
                            <div class="error-msg">请选择库区</div>
                        </div>
                        <div class="form-group">
                            <label for="storageRack">货架/库位 <span class="required">*</span></label>
                            <input type="text" id="storageRack" placeholder="如：03-12" required>
                            <div class="error-msg">请输入货架/库位</div>
                        </div>
                        <div class="form-group">
                            <label for="storageType">存储方式</label>
                            <select id="storageType">
                                <option value="货架">货架存储</option>
                                <option value="地堆">地堆存储</option>
                                <option value="托盘">托盘存储</option>
                                <option value="货柜">货柜存储</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="storageTemperature">温度要求 (°C)</label>
                            <input type="text" id="storageTemperature" placeholder="如：常温 / 0-4°C">
                        </div>
                    </div>
                </section>

                <!-- ===== 第三步：质检与IoT ===== -->
                <section class="form-section">
                    <div class="section-header">
                        <h3><i class="fas fa-clipboard-check"></i> 质检与 IoT 信息</h3>
                        <span class="step-badge">步骤 3/4</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="qualityStatus">质检状态 <span class="required">*</span></label>
                            <select id="qualityStatus" required>
                                <option value="">请选择</option>
                                <option value="合格">合格</option>
                                <option value="待检">待检</option>
                                <option value="不合格">不合格</option>
                            </select>
                            <div class="error-msg">请选择质检状态</div>
                        </div>
                        <div class="form-group">
                            <label for="qualityReport">质检报告</label>
                            <div class="file-upload-wrapper">
                                <input type="file" id="qualityReport" accept=".pdf,.jpg,.jpeg,.png">
                                <label for="qualityReport" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i> 上传报告
                                </label>
                                <span class="file-name" id="reportFileName">未选择文件</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="iotDevice">IoT 设备</label>
                            <select id="iotDevice">
                                <option value="无">无</option>
                                <option value="RFID-01">RFID 标签</option>
                                <option value="温湿度-01">温湿度传感器</option>
                                <option value="智能锁-01">智能锁</option>
                                <option value="GPS-01">GPS 定位</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="iotDeviceId">设备编号</label>
                            <input type="text" id="iotDeviceId" placeholder="如：RFID-8802-331A">
                        </div>
                    </div>
                </section>

                <!-- ===== 第四步：附加信息 ===== -->
                <section class="form-section">
                    <div class="section-header">
                        <h3><i class="fas fa-paperclip"></i> 附加信息</h3>
                        <span class="step-badge">步骤 4/4</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="supplier">供应商</label>
                            <input type="text" id="supplier" placeholder="如：江西铜业集团">
                        </div>
                        <div class="form-group">
                            <label for="transportNo">运输单号</label>
                            <input type="text" id="transportNo" placeholder="如：YD-2026-08023-01">
                        </div>
                        <div class="form-group full-width">
                            <label for="inboundRemarks">备注</label>
                            <textarea id="inboundRemarks" rows="2" placeholder="其他需要说明的信息..."></textarea>
                        </div>
                    </div>
                </section>

                <!-- ===== 底部操作按钮 ===== -->
                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="history.back()">
                        <i class="fas fa-times"></i> 取消
                    </button>
                    <button type="reset" class="btn btn-reset">
                        <i class="fas fa-undo"></i> 重置
                    </button>
                    <button type="submit" class="btn btn-submit" id="submitBtn">
                        <i class="fas fa-link"></i> 提交上链
                    </button>
                </div>

            </form>

            <!-- ===== 右侧：入库预览 ===== -->
            <aside class="preview-column">
                <div class="preview-card">
                    <h4><i class="fas fa-file-signature"></i> 入库单预览</h4>
                    <div class="preview-item">
                        <span class="label">入库单号</span>
                        <span class="value" id="previewId">IN-2026-08-24-001</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">货物</span>
                        <span class="value" id="previewCargo">—</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">规格</span>
                        <span class="value" id="previewSpec">—</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">数量</span>
                        <span class="value" id="previewQuantity">—</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">总重</span>
                        <span class="value" id="previewWeight">—</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">库位</span>
                        <span class="value" id="previewLocation">—</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">质检</span>
                        <span class="value" id="previewQuality">—</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">链上状态</span>
                        <span class="value" id="previewStatus">
                            <span class="status-badge pending">待上链</span>
                        </span>
                    </div>
                </div>

                <div class="tips-card">
                    <h4><i class="fas fa-info-circle"></i> 登记提示</h4>
                    <ul>
                        <li>带 <span class="required">*</span> 的为必填项</li>
                        <li>提交后自动生成入库单并上链存证</li>
                        <li>入库单将同步至「库存管理」</li>
                        <li>IoT 设备数据将实时监控货物状态</li>
                    </ul>
                </div>
            </aside>

        </main>
    </div>

    <!-- 业务 JS 放最后 -->
    <script src="入库登记.js"></script>
</body>

</html>
