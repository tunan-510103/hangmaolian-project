<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>用户管理</title>
    <link rel="stylesheet" href="用户管理.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>

    <!-- ===== 侧边导航 ===== -->
    <aside class="sidebar">
        <div class="logo">
            管理平台
        </div>
        <nav>
            <ul>
                <li><a href="管理界面.html">首页</a></li>
                <li><a href="用户管理.html" class="active">用户管理</a></li>
                <li><a href="权限管理.html">权限管理</a></li>
                <li><a href="#" data-page="quota" onclick="location.href='发票赋额.html'">发票赋额</a></li>
                <li><a href="#" data-page="trace" onclick="location.href='存证溯源.html'">存证溯源</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar" id="userAvatar">管</div>
                <div>
                    <div style="color:#ffffff; font-weight:500;" id="userName">管理员</div>
                    <div style="font-size:0.75rem; color:#6a8ba0;" id="userEmail">admin@demo.com</div>
                </div>
            </div>
            <div style="margin-top:0.5rem; font-size:0.8rem;">
                <a href="#" style="color:#6a8ba0; text-decoration:none;" onclick="handleLogout(); return false;">退出</a>
            </div>
        </div>
    </aside>

    <!-- ===== 主内容 ===== -->
    <main class="main">

        <!-- ===== 顶部栏 ===== -->
        <div class="topbar">
            <div class="topbar-left">
                <h1>用户管理</h1>
                <div class="date-badge" id="dateDisplay">加载中...</div>
            </div>
            <div class="topbar-right">
                <a href="设置.html" class="settings-btn">设置</a>
            </div>
        </div>

        <!-- ===== 用户管理内容 ===== -->
        <div class="user-header">
            <div class="subtitle">管理平台所有注册用户</div>
        </div>

        <!-- ===== 工具栏 ===== -->
        <div class="toolbar">
            <div class="toolbar-left">
                <input type="text" id="searchInput" placeholder="搜索用户..." oninput="applyFilters()">
                <select id="roleFilter" onchange="applyFilters()">
                    <option value="贸易商">贸易商</option>
                    <option value="仓储方">仓储方</option>
                    <option value="物流方">物流方</option>
                </select>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="all">全部状态</option>
                    <option value="active">已激活</option>
                    <option value="inactive">已停用</option>
                    <option value="pending">待审核</option>
                </select>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-secondary" onclick="loadUsers()">刷新</button>
            </div>
        </div>

        <!-- ===== 用户表格 ===== -->
        <div class="table-wrap">
            <table class="user-table">
                <thead>
                    <tr>
                        <th>用户</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>注册时间</th>
                        <th style="text-align:center;">操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="5" class="loading-text">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ===== 分页 ===== -->
        <div class="pagination">
            <div class="info" id="paginationInfo">共 0 条记录</div>
            <div class="pages" id="paginationPages"></div>
        </div>

        <!-- ===== 新增：仓储方 / 物流方入驻申请 ===== -->
        <div class="application-section">
            <div class="section-header">
                <h2>仓储方 / 物流方入驻申请</h2>
                <div style="display:flex;align-items:center;gap:0.75rem;">
                    <span class="pending-badge" id="pendingCount">0 条待审核</span>
                    <button class="btn btn-secondary btn-sm" onclick="loadApplications()">刷新</button>
                </div>
            </div>
            <div class="table-wrap">
                <table class="application-table">
                    <thead>
                        <tr>
                            <th>申请方</th>
                            <th>申请角色</th>
                            <th>联系人</th>
                            <th>申请时间</th>
                            <th style="text-align:center;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="applicationTableBody">
                        <tr>
                            <td colspan="5" class="loading-text">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
    </main>


    <!-- ===== Toast 消息 ===== -->
    <div class="toast" id="toast"></div>

    <script src="用户管理.js"></script>

</body>

</html>
