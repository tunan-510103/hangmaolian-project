<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航贸链 · 单证中心</title>
    <link rel="stylesheet" href="物流方-单证中心.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">物流方</span>
            </div>
            <nav class="nav-menu">
                <div class="nav-item" onclick="location.href='物流方-工作台.html'">
                    <span class="nav-label">工作台</span>
                </div>
                <div class="nav-item active" onclick="location.href='物流方-单证中心.html'">
                    <span class="nav-label">单证中心</span>
                </div>
                <div class="nav-item" onclick="location.href='物流方-存证档案.html'">
                    <span class="nav-label">存证档案</span>
                </div>
            </nav>
            <div class="nav-footer">
                <!-- ✅ 退出：清登录态，跳物流方登录页 -->
                <div class="nav-item"
                    onclick="localStorage.removeItem('current_user'); localStorage.removeItem('token'); location.href='登录-物流方.html'">
                    <span class="nav-label"><i class="fas fa-sign-out-alt" style="width:20px;"></i> 退出</span>
                </div>
            </div>
        </aside>

        <!-- 右侧主内容 -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-right">
                    <div class="notifications">
                        <span class="badge" id="notificationBadge">0</span>
                        🔔
                    </div>
                    <button class="settings-btn" title="设置">
                        <div id="avatarText" onclick="location.href='设置.html'">⚙</div>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <!-- ===== 单证中心内容 ===== -->
                <div class="doc-layout">
                    <div class="doc-upload-area">
                        <div class="doc-search-section">
                            <input type="text" id="docSearchInput" placeholder="输入单证编号关联任务...">
                            <button class="search-btn" id="docSearchBtn">关联</button>
                            <span class="doc-type-hint">支持：<strong>公路运单</strong> · <strong>海运提单</strong> ·
                                <strong>仓单</strong></span>
                        </div>

                        <div class="upload-zone" id="uploadZone">
                            <p>拖拽或点击上传单证</p>
                            <p class="hint">支持 JPG, PNG, PDF 格式</p>
                            <input type="file" id="fileInput" hidden accept="image/*,.pdf">
                        </div>

                        <div class="doc-compare">
                            <div class="compare-item">
                                <span class="compare-label"> OCR 识别结果</span>
                                <span class="compare-value" id="ocrData">等待上传...</span>
                            </div>
                            <div class="compare-item">
                                <span class="compare-label">系统原始数据</span>
                                <span class="compare-value" id="sysData">等待比对...</span>
                            </div>
                            <div class="diff-highlight info" id="diffDisplay">请上传单证或关联任务</div>
                        </div>

                        <div class="doc-actions">
                            <button class="btn btn-outline" id="verifyBtn">✓ 核验通过</button>
                            <button class="btn btn-outline danger" id="errorBtn">✗ 标记异常</button>
                            <button class="btn btn-primary" id="onChainBtn">上链存证</button>
                        </div>

                        <div class="onchain-result" id="onchainResult">
                            <span class="label">存证ID：</span>
                            <span class="hash" id="certId">--</span>
                            <button class="btn-copy" id="copyBtn">复制</button>
                            <span class="time" id="certTime">--</span>
                        </div>
                    </div>

                    <div class="doc-info">
                        <div class="cargo-card" id="cargoCard">
                            <h4>货物信息 <span id="logisticsTag" class="logistics-tag"
                                    style="font-size:12px;margin-left:8px;">—</span></h4>
                            <div id="cargoContent">
                                <div class="loading-placeholder">请关联任务或上传单证</div>
                            </div>
                        </div>

                        <div class="chain-timeline">
                            <h4>⛓️ 链上里程碑</h4>
                            <div class="timeline">
                                <span class="node done">交易签约</span>
                                <span class="arrow">→</span>
                                <span class="node done">仓储入库</span>
                                <span class="arrow">→</span>
                                <span class="node active">物流发运</span>
                                <span class="arrow">→</span>
                                <span class="node">税务调用</span>
                            </div>
                            <div class="chain-block-info">当前区块高度：#<span id="chainBlockHeight">8,234,567</span> ｜
                                确认数：<span id="chainConfirmCount">12</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="物流方-单证中心.js"></script>
</body>

</html>
