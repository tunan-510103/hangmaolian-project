<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申请成为物流方</title>
    <link rel="stylesheet" href="物流方申请.css">
</head>

<body>

    <div id="toast" class="toast"></div>

    <header class="topbar">
        <div class="topbar-left">
            <a href="#" class="back-btn" onclick="history.back(); return false;">← 返回</a>
            <h1>申请成为物流方</h1>
        </div>
        <div class="topbar-right">
            <span id="userDisplay">企业用户</span>
        </div>
    </header>

    <div class="apply-container">

        <div class="apply-card info-card">
            <div class="info-content">
                <h3>物流方申请说明</h3>
                <p>成为物流方后，您可以为其他企业提供物流服务，包括但不限于：</p>
                <ul>
                    <li>货物运输与配送</li>
                    <li>物流轨迹追踪</li>
                    <li>运单管理</li>
                    <li>物流费用结算</li>
                </ul>
                <p
                    style="margin-top: 0.5rem; color: #856404; background: #fff3cd; padding: 0.5rem 1rem; border-radius: 8px;">
                    提交申请后，我们将在一个工作日内审核
                </p>
            </div>
        </div>

        <div class="apply-card">
            <div class="apply-card-header">
                <h2>物流方申请信息</h2>
                <span class="status-badge" id="applyStatus" style="display:none;"></span>
            </div>
            <div class="apply-body">
                <form id="applyForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="companyName">企业名称（留空将自动使用邮箱前缀）</label>
                            <input type="text" id="companyName" placeholder="请输入企业全称（可选）">
                        </div>
                        <div class="form-group">
                            <label for="contactPerson">联系人 <span class="required">*</span></label>
                            <input type="text" id="contactPerson" placeholder="请输入联系人姓名" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="contactPhone">联系电话 <span class="required">*</span></label>
                            <input type="tel" id="contactPhone" placeholder="请输入手机号码" required>
                        </div>
                        <div class="form-group">
                            <label for="contactEmail">联系邮箱 <span class="required">*</span></label>
                            <input type="email" id="contactEmail" placeholder="请输入邮箱地址" required>
                        </div>
                    </div>

                    <!-- ========== 新增：登录密码 ========== -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">登录密码 <span class="required">*</span></label>
                            <input type="password" id="password" placeholder="请输入登录密码（至少6位）" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">确认密码 <span class="required">*</span></label>
                            <input type="password" id="confirmPassword" placeholder="请再次输入密码" minlength="6" required>
                        </div>
                    </div>
                    <!-- ========== 新增结束 ========== -->

                    <div class="form-row">
                        <div class="form-group">
                            <label for="logisticsType">物流类型 <span class="required">*</span></label>
                            <select id="logisticsType" required>
                                <option value="">请选择物流类型</option>
                                <option value="road">公路运输</option>
                                <option value="railway">铁路运输</option>
                                <option value="air">航空运输</option>
                                <option value="sea">海运</option>
                                <option value="express">快递配送</option>
                                <option value="intermodal">多式联运</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="serviceScope">服务范围 <span class="required">*</span></label>
                            <select id="serviceScope" required>
                                <option value="">请选择服务范围</option>
                                <option value="local">同城</option>
                                <option value="regional">区域（省内）</option>
                                <option value="domestic">国内</option>
                                <option value="international">国际</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicleCount">自有车辆数</label>
                            <input type="number" id="vehicleCount" placeholder="请输入自有车辆数量" min="0">
                        </div>
                        <div class="form-group">
                            <label for="businessLicense">营业执照编号</label>
                            <input type="text" id="businessLicense" placeholder="请输入营业执照编号">
                        </div>
                    </div>

                    <div class="form-row full-width">
                        <div class="form-group">
                            <label for="serviceDesc">服务描述</label>
                            <textarea id="serviceDesc" rows="3" placeholder="请描述您能提供的物流服务内容（选填）"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="resetBtn">重置</button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">提交申请</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="物流方申请.js"></script>
</body>

</html>
