<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>管理首页</title>
    <link rel="stylesheet" href="管理界面.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>

    <!-- ===== 侧边导航 ===== -->
    <aside class="sidebar">
        <div class="logo">管理平台</div>
        <nav>
            <ul>
                <li><a href="#" class="active" data-page="dashboard" onclick="location.href='管理界面.html'">首页</a></li>
                <li><a href="#" data-page="users" onclick="location.href='用户管理.html'">用户管理</a></li>
                <li><a href="#" data-page="permissions" onclick="location.href='权限管理.html'">权限管理</a></li>
                <li><a href="#" data-page="quota" onclick="location.href='发票赋额.html'">发票赋额</a></li>
                <li><a href="#" data-page="trace" onclick="location.href='存证溯源.html'">存证溯源</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar" id="userAvatar">管</div>
                <div>
                    <div style="color:#ffffff; font-weight:500;" id="userName">管理员</div>
                    <div style="font-size:0.75rem; color:#6a8ba0;" id="userEmail">admin@demo.com</div>
                </div>
            </div>
            <div style="margin-top:0.5rem; font-size:0.8rem;">
                <!-- ✅ 退出：清登录态，跳平台管理登录页 -->
                <a href="#" style="color:#6a8ba0; text-decoration:none;" onclick="handleLogout(); return false;">退出</a>
            </div>
        </div>
    </aside>

    <!-- ===== 主内容 ===== -->
    <main class="main">

        <!-- 顶部栏 -->
        <div class="topbar">
            <div class="topbar-left">
                <h1>管理首页</h1>
                <div class="date-badge" id="dateDisplay">加载中...</div>
            </div>
            <div class="topbar-right">
                <a href="#" class="settings-btn" onclick="handleSettings(); return false;">
                    设置
                </a>
            </div>
        </div>

        <!-- 统计卡片 -->
        <section class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">总交易额</div>
                <div class="stat-number" id="statRevenue">--</div>
                <div class="stat-change" id="statRevenueChange">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">注册用户</div>
                <div class="stat-number" id="statUsers">--</div>
                <div class="stat-change" id="statUsersChange">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">待处理事务</div>
                <div class="stat-number" id="statPending">--</div>
                <div class="stat-change down" id="statPendingChange">--</div>
            </div>
        </section>

        <!-- 双栏：近期活动 + 待办 -->
        <section class="two-col">

            <!-- 左侧：近期活动 -->
            <div class="card">
                <div class="card-header">
                    <h3>近期活动</h3>
                    <span class="badge-link" onclick="handleViewAllActivities()">查看全部 →</span>
                </div>
                <ul class="activity-list" id="activityList">
                    <li class="loading-text">加载中...</li>
                </ul>
            </div>

            <!-- 右侧：待办事项 -->
            <div class="card">
                <div class="card-header">
                    <h3>待办事项</h3>
                    <span style="font-size:0.8rem; color:#6b8ba0;" id="todoCount">0项待处理</span>
                </div>
                <ul class="todo-list" id="todoList">
                    <li class="loading-text">加载中...</li>
                </ul>
            </div>

        </section>

        <!-- 底部信息 -->
        <div
            style="margin-top:1.5rem; font-size:0.85rem; color:#8aa8bb; text-align:center; border-top:1px solid #e2eaf0; padding-top:1.5rem;">
            <span>数据更新于 <span id="updateTime">--</span> · 平台运行正常</span>
        </div>

    </main>

    <script src="管理界面.js"></script>

</body>

</html>
