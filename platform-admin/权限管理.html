<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>权限管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="权限管理.css">

    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>
    <!-- ===== 侧边导航（与管理界面一致） ===== -->
    <aside class="sidebar">
        <div class="logo">权限管理</div>
        <nav>
            <ul>
                <li><a href="#" onclick="location.href='管理界面.html'">首页</a></li>
                <li><a href="#" onclick="location.href='用户管理.html'">用户管理</a></li>
                <li><a href="#" class="active" onclick="location.href='权限管理.html'">权限管理</a></li>
                <li><a href="#" data-page="quota" onclick="location.href='发票赋额.html'">发票赋额</a></li>
                <li><a href="#" data-page="trace" onclick="location.href='存证溯源.html'">存证溯源</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar" id="userAvatar">管</div>
                <div>
                    <div style="color:#ffffff; font-weight:500;" id="userName">管理员</div>
                    <div style="font-size:0.75rem; color:#6a8ba0;" id="userEmail">admin@demo.com</div>
                </div>
            </div>
            <div style="margin-top:0.5rem; font-size:0.8rem;">
                <a href="#" style="color:#6a8ba0; text-decoration:none;" onclick="handleLogout(); return false;">退出</a>
            </div>
        </div>
    </aside>

    <!-- ===== 主内容 ===== -->
    <main class="main">

        <!-- 顶部栏（与管理界面一致） -->
        <div class="topbar">
            <div class="topbar-left">
                <h1>权限管理</h1>
                <div class="date-badge" id="dateDisplay">加载中...</div>
            </div>
            <div class="topbar-right">
                <a href="#" class="settings-btn" onclick="handleSettings(); return false;">
                    设置
                </a>
            </div>
        </div>

        <!-- 统计卡片（仅总角色 + 总权限项） -->
        <section class="stats-grid" id="statsGrid">
            <div class="stat-card total">
                <span class="stat-icon"><i class="fas fa-users-cog"></i></span>
                <div class="stat-number" id="statTotal">--</div>
                <div class="stat-label">总角色</div>
            </div>
            <div class="stat-card permissions">
                <span class="stat-icon"><i class="fas fa-key"></i></span>
                <div class="stat-number" id="statPermissions">--</div>
                <div class="stat-label">总权限项</div>
            </div>
        </section>

        <!-- 筛选栏 -->
        <div class="filter-section">
            <div class="filter-right">
                <input type="text" id="searchInput" placeholder="角色名称 / 描述...">
                <button class="btn btn-primary" id="searchBtn"><i class="fas fa-search"></i> 搜索</button>
                <button class="btn btn-outline" id="resetBtn"><i class="fas fa-redo"></i> 重置</button>
            </div>
        </div>

        <!-- 角色表格（无状态列） -->
        <div class="table-wrap">
            <div class="table-header">
                <h4><i class="fas fa-list"></i>角色列表</h4>
                <span class="count" id="recordCount">共 0 条</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>角色名称</th>
                        <th>描述</th>
                        <th>用户数</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="no-data"><i class="fas fa-inbox"></i>暂无角色数据</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination">
                <span>共 <span id="totalCount">0</span> 条</span>
                <div class="page-btns">
                    <button class="btn-page" id="prevPage"><i class="fas fa-chevron-left"></i> 上一页</button>
                    <span id="pageInfo" style="padding:0.25rem 0.8rem;">1 / 1</span>
                    <button class="btn-page" id="nextPage">下一页 <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

    </main>

    <!-- ===== 权限配置弹窗 ===== -->
    <div class="permission-modal-overlay" id="permissionModal">
        <div class="permission-modal">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i>配置权限 · <span id="modalRoleName">角色名称</span></h3>
                <button class="close-btn" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-hint">
                <i class="fas fa-info-circle"></i> 勾选即表示该角色拥有对应菜单和操作权限
            </div>
            <ul class="permission-tree" id="permissionTree">
                <!-- 由JS动态渲染 -->
            </ul>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalResetBtn">重置</button>
                <button class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存权限</button>
            </div>
        </div>
    </div>

    <!-- Toast容器 -->
    <div id="toastContainer"></div>

    <script src="权限管理.js"></script>
</body>

</html>
