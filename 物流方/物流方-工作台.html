<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航贸链 · 工作台</title>
    <link rel="stylesheet" href="物流方-工作台.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>

    <!-- ✅ 新增：新建物流按钮样式（如 CSS 中已有 .btn 可删除此段） -->
    <style>
        .feed-new-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 10px 0;
            background: #141e2b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
            letter-spacing: 0.3px;
        }

        .feed-new-btn:hover {
            background: #2a3a4a;
            box-shadow: 0 4px 12px rgba(20, 30, 43, 0.2);
        }

        .feed-new-btn:active {
            transform: scale(0.98);
        }

        .feed-new-btn:disabled {
            background: #a0b8d0;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">物流方</span>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" onclick="location.href='物流方-工作台.html'">
                    <span class="nav-label">工作台</span>
                </div>
                <div class="nav-item" onclick="location.href='物流方-单证中心.html'">
                    <span class="nav-label">单证中心</span>
                </div>
                <div class="nav-item" onclick="location.href='物流方-存证档案.html'">
                    <span class="nav-label">存证档案</span>
                </div>
            </nav>
            <div class="nav-footer">
                <!-- ✅ 退出：清登录态，跳物流方登录页 -->
                <div class="nav-item"
                    onclick="localStorage.removeItem('current_user'); localStorage.removeItem('token'); location.href='登录-物流方.html'">
                    <span class="nav-label"><i class="fas fa-sign-out-alt" style="width:20px;"></i> 退出</span>
                </div>
            </div>
        </aside>

        <!-- 右侧主内容 -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-right">
                    <div class="notifications">
                        <span class="badge" id="notificationBadge">0</span>
                        🔔
                    </div>
                    <button class="settings-btn" title="设置">
                        <div id="avatarText" onclick="location.href='设置.html'">⚙</div>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <!-- ===== 工作台内容 ===== -->
                <div class="overview-layout">
                    <div class="task-column">
                        <div class="task-header">
                            <h3>今日任务</h3>
                            <span class="task-count" id="taskCount">0 项</span>
                        </div>
                        <div class="task-search-bar">
                            <input type="text" id="taskSearchInput" placeholder=" 搜索任务编号、货物名称、起讫地...">
                            <button class="search-btn" id="taskSearchBtn">搜索</button>
                        </div>
                        <div class="task-filters">
                            <span class="filter-tag active" data-filter="all">全部</span>
                            <span class="filter-tag" data-filter="active">进行中</span>
                            <span class="filter-tag" data-filter="pending">待处理</span>
                            <span class="filter-tag" data-filter="error">异常</span>
                        </div>
                        <div class="task-list" id="taskList">
                            <div class="loading-spinner">加载中...</div>
                        </div>
                    </div>
                    <div class="collab-column">
                        <div class="stats-cards">
                            <div class="stat-item">
                                <span class="stat-value" id="statOnChain">--</span>
                                <span class="stat-label">今日上链</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value" id="statPending">--</span>
                                <span class="stat-label">待核验</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value" id="statTaxCalls">--</span>
                                <span class="stat-label">税务调用</span>
                            </div>
                        </div>
                        <div class="dynamic-feed">
                            <h4>协同动态</h4>
                            <ul id="feedList">
                                <li style="color:#9aaec2;text-align:center;padding:20px 0;">加载动态中...</li>
                            </ul>
                            <!-- ✅ 新增：新建物流按钮 -->
                            <button class="feed-new-btn" id="newLogisticsBtn" onclick="location.href='新建物流.html'">
                                +新建物流
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="物流方-工作台.js"></script>
</body>

</html>
