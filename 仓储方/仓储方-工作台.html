<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓储方 · 工作台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="仓储方-工作台.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- ===== 左侧导航 ===== -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">仓储方</span>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" onclick="location.href='仓储方-工作台.html'">
                    <span class="nav-label"><i class="fas fa-tachometer-alt" style="width:20px;"></i> 工作台</span>
                </div>
                <div class="nav-item" onclick="location.href='仓储方-仓单管理.html'">
                    <span class="nav-label"><i class="fas fa-file-invoice" style="width:20px;"></i> 仓单管理</span>
                </div>
                <div class="nav-item" onclick="location.href='仓储方-库存管理.html'">
                    <span class="nav-label"><i class="fas fa-warehouse" style="width:20px;"></i> 库存管理</span>
                </div>
            </nav>
            <div class="nav-footer">
                <!-- ✅ 退出：清登录态，跳仓储方登录页 -->
                <div class="nav-item"
                    onclick="localStorage.removeItem('current_user'); localStorage.removeItem('token'); location.href='登录-仓储方.html'">
                    <span class="nav-label"><i class="fas fa-sign-out-alt" style="width:20px;"></i> 退出</span>
                </div>
            </div>
        </aside>

        <!-- ===== 右侧主内容 ===== -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <span class="page-title"></span>
                </div>
                <div class="top-bar-right">
                    <span class="company-name" id="companyName"></span>
                    <div class="notifications">
                        <span class="badge" id="notifBadge">0</span>
                        <i class="fas fa-bell"></i>
                    </div>
                    <button class="settings-btn" title="设置">
                        <div id="avatarText" onclick="location.href='设置.html'">设置</div>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-icon"><i class="fas fa-file-invoice"></i></span>
                        <span class="stat-number" id="statOrders">--</span>
                        <span class="stat-label">在库仓单</span>
                        <span class="stat-sub" id="statOrdersSub">今日新增 --</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon"><i class="fas fa-check-circle"></i></span>
                        <span class="stat-number" id="statVerified">--</span>
                        <span class="stat-label">链上核验</span>
                        <span class="stat-sub" id="statVerifiedSub">核验通过率 --</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon"><i class="fas fa-exclamation-triangle"></i></span>
                        <span class="stat-number" id="statWarnings">--</span>
                        <span class="stat-label">待处理预警</span>
                        <span class="stat-sub" id="statWarningsSub">需立即处理 -- 项</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon"><i class="fas fa-chart-pie"></i></span>
                        <span class="stat-number" id="statUtilization">--</span>
                        <span class="stat-label">库位使用率</span>
                        <span class="stat-sub" id="statUtilSub">可用库位 -- 个</span>
                    </div>
                </div>

                <div class="two-column">
                    <div class="column-left">
                        <div class="panel">
                            <div class="panel-header">
                                <h4><i class="fas fa-tasks"></i> 待办任务</h4>
                                <span class="more">查看全部 →</span>
                            </div>
                            <div id="taskList">
                                <div class="loading-spinner">加载中...</div>
                            </div>
                        </div>
                        <div class="panel">
                            <div class="panel-header">
                                <h4><i class="fas fa-link"></i> 最近上链存证</h4>
                                <span class="more">查看全部 →</span>
                            </div>
                            <div id="chainList">
                                <div class="loading-spinner">加载中...</div>
                            </div>
                        </div>
                    </div>
                    <div class="column-right">
                        <div class="panel">
                            <div class="panel-header">
                                <h4><i class="fas fa-bolt"></i> 快捷操作</h4>
                            </div>
                            <div class="quick-actions">
                                <div class="quick-btn" onclick="location.href='新建仓单.html'">
                                    <span class="quick-icon"><i class="fas fa-file-invoice"></i></span>
                                    新建仓单
                                </div>
                                <div class="quick-btn" onclick="location.href='导出税务.html'">
                                    <span class="quick-icon"><i class="fas fa-file-export"></i></span>
                                    导出税务数据
                                </div>
                                <div class="quick-btn" onclick="location.href='入库登记.html'">
                                    <span class="quick-icon"><i class="fas fa-arrow-down"></i></span>
                                    入库登记
                                </div>
                                <div class="quick-btn" onclick="location.href='扫码核验.html'">
                                    <span class="quick-icon"><i class="fas fa-qrcode"></i></span>
                                    扫码核验
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="仓储方-工作台.js"></script>
</body>

</html>
