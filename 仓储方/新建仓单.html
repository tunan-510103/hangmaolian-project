<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>航贸链 · 新建仓单</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="新建仓单.css" />

    <!-- ✅ 新增：先引入 request.js（统一带 token），再引入 auth-check.js（角色校验） -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
</head>

<body>

    <div class="page-container">
        <!-- 顶部栏 -->
        <header class="top-bar">
            <div class="top-left">
                <button class="back-btn" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i> 返回
                </button>
                <h1 class="page-title"><i class="fas fa-file-invoice"></i> 新建仓单</h1>
            </div>
        </header>

        <!-- 主体内容 -->
        <main class="main-content">
            <form id="warehouseForm" novalidate>
                <!-- 左列：核心表单 -->
                <div class="form-column">
                    <!-- 货物信息 -->
                    <section class="form-section">
                        <h3><i class="fas fa-cube"></i> 货物信息</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="goodsName">货物名称 <span class="required">*</span></label>
                                <input type="text" id="goodsName" placeholder="如：电解铜" required />
                                <div class="error-msg">请输入货物名称</div>
                            </div>
                            <div class="form-group">
                                <label for="goodsSpec">规格型号 <span class="required">*</span></label>
                                <input type="text" id="goodsSpec" placeholder="如：Cu ≥ 99.95%" required />
                                <div class="error-msg">请输入规格型号</div>
                            </div>
                            <div class="form-group">
                                <label for="netWeight">净重 (kg) <span class="required">*</span></label>
                                <input type="number" id="netWeight" placeholder="如：5000" min="0.1" step="0.1"
                                    required />
                                <div class="error-msg">请输入有效重量</div>
                            </div>
                            <div class="form-group">
                                <label for="unit">单位</label>
                                <select id="unit">
                                    <option value="吨">吨 (t)</option>
                                    <option value="千克" selected>千克 (kg)</option>
                                    <option value="克">克 (g)</option>
                                    <option value="件">件</option>
                                    <option value="箱">箱</option>
                                </select>
                            </div>
                        </div>
                    </section>

                    <!-- 仓储信息 -->
                    <section class="form-section">
                        <h3><i class="fas fa-warehouse"></i> 仓储信息</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="locationArea">库区 <span class="required">*</span></label>
                                <select id="locationArea" required>
                                    <option value="">请选择库区</option>
                                    <option value="A">A区</option>
                                    <option value="B">B区</option>
                                    <option value="C">C区</option>
                                    <option value="D">D区</option>
                                    <option value="E">E区</option>
                                    <option value="F">F区</option>
                                </select>
                                <div class="error-msg">请选择库区</div>
                            </div>
                            <div class="form-group">
                                <label for="locationRack">货架/库位 <span class="required">*</span></label>
                                <input type="text" id="locationRack" placeholder="如：03-12" required />
                                <div class="error-msg">请输入货架/库位</div>
                            </div>
                            <div class="form-group">
                                <label for="holder">持有人 <span class="required">*</span></label>
                                <input type="text" id="holder" placeholder="如：江铜贸易有限公司" required />
                                <div class="error-msg">请输入持有人</div>
                            </div>
                            <div class="form-group">
                                <label for="iotStatus">IoT 设备状态</label>
                                <select id="iotStatus">
                                    <option value="在线">在线</option>
                                    <option value="离线">离线</option>
                                </select>
                            </div>
                        </div>
                    </section>

                    <!-- 附加信息 -->
                    <section class="form-section">
                        <h3><i class="fas fa-paperclip"></i> 附加信息</h3>
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label for="reportFile">质检报告</label>
                                <div class="file-upload-wrapper">
                                    <input type="file" id="reportFile" accept=".pdf,.jpg,.jpeg,.png" />
                                    <label for="reportFile" class="file-upload-label">
                                        <i class="fas fa-cloud-upload-alt"></i> 上传质检报告 (PDF/JPG/PNG)
                                    </label>
                                    <span class="file-name" id="fileName">未选择文件</span>
                                </div>
                            </div>
                            <div class="form-group full-width">
                                <label for="remarks">备注</label>
                                <textarea id="remarks" rows="2" placeholder="其他需要说明的信息..."></textarea>
                            </div>
                        </div>
                    </section>

                    <!-- 底部操作按钮 -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-cancel" onclick="history.back()">
                            <i class="fas fa-times"></i> 取消
                        </button>
                        <button type="submit" class="btn btn-submit" id="submitBtn">
                            <i class="fas fa-link"></i> 提交上链
                        </button>
                    </div>
                </div>

                <!-- 右列：预览 / 辅助信息 -->
                <aside class="preview-column">
                    <div class="preview-card">
                        <h4><i class="fas fa-file-signature"></i> 仓单预览</h4>
                        <div class="preview-item">
                            <span class="label">仓单编号</span>
                            <span class="value" id="previewId">CK-2026-08-24-001</span>
                        </div>
                        <div class="preview-item">
                            <span class="label">货物</span>
                            <span class="value" id="previewGoods">—</span>
                        </div>
                        <div class="preview-item">
                            <span class="label">规格</span>
                            <span class="value" id="previewSpec">—</span>
                        </div>
                        <div class="preview-item">
                            <span class="label">净重</span>
                            <span class="value" id="previewWeight">—</span>
                        </div>
                        <div class="preview-item">
                            <span class="label">库位</span>
                            <span class="value" id="previewLocation">—</span>
                        </div>
                        <div class="preview-item">
                            <span class="label">持有人</span>
                            <span class="value" id="previewHolder">—</span>
                        </div>
                        <div class="preview-item">
                            <span class="label">链上状态</span>
                            <span class="value" id="previewStatus">
                                <span class="status-badge pending">待上链</span>
                            </span>
                        </div>
                    </div>

                    <div class="tips-card">
                        <h4><i class="fas fa-info-circle"></i> 填写提示</h4>
                        <ul>
                            <li>带 <span class="required">*</span> 的为必填项</li>
                            <li>提交后将自动上链存证</li>
                            <li>存证后数据不可篡改</li>
                            <li>仓单编号由系统自动生成</li>
                        </ul>
                    </div>
                </aside>
            </form>
        </main>
    </div>

    <script src="新建仓单.js"></script>
</body>

</html>
