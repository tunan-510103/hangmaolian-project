<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航贸链 · 数据上链存证</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- ✅ 新增：request.js + auth-check.js -->
    <script src="request.js"></script>
    <script src="auth-check.js"></script>
    <link rel="stylesheet" href="存证管理.css">

    <!-- ✅ 新增：额度 / 消息中心 弹窗样式 -->
    <style>
        /* ===== 弹窗通用 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 31, 46, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 1.4rem 1.6rem;
            max-width: 520px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #eef2f6;
        }

        .modal-head h3 {
            font-size: 1.05rem;
            color: #0b1f2e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #9ab0c2;
            cursor: pointer;
            line-height: 1;
            width: 28px;
            height: 28px;
            border-radius: 8px;
        }

        .modal-close:hover {
            background: #f0f4f8;
            color: #0b1f2e;
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
        }

        /* ===== 额度弹窗 ===== */
        .quota-current {
            background: linear-gradient(135deg, #0b1f2e 0%, #1a4054 100%);
            border-radius: 14px;
            padding: 1.2rem 1.4rem;
            color: #fff;
            margin-bottom: 1rem;
        }

        .quota-current .quota-label {
            font-size: 0.82rem;
            color: #b0c9db;
        }

        .quota-current .quota-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.2rem;
        }

        .quota-current .quota-value small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #b0c9db;
        }

        .quota-current .quota-meta {
            display: flex;
            gap: 1.2rem;
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: #b0c9db;
            flex-wrap: wrap;
        }

        .quota-current .quota-meta strong {
            color: #fff;
        }

        .quota-usage {
            margin-bottom: 1.2rem;
        }

        .quota-usage .usage-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #4a6b80;
            margin-bottom: 0.4rem;
        }

        .quota-usage .usage-bar {
            height: 8px;
            background: #eef2f6;
            border-radius: 10px;
            overflow: hidden;
        }

        .quota-usage .usage-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #4a9ec4, #1f6f9e);
            border-radius: 10px;
            transition: width 0.4s;
        }

        .quota-usage .usage-bar-inner.warn {
            background: linear-gradient(90deg, #f0b34a, #b46f1a);
        }

        .quota-usage .usage-bar-inner.danger {
            background: linear-gradient(90deg, #e87a7a, #b33a3a);
        }

        .quota-usage .usage-text {
            font-size: 0.78rem;
            color: #9ab0c2;
            margin-top: 0.4rem;
        }

        .quota-history-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #0b1f2e;
            margin-bottom: 0.6rem;
            padding-top: 0.8rem;
            border-top: 1px solid #eef2f6;
        }

        .quota-history {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .quota-history-item {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid #f0f4f8;
        }

        .quota-history-item:last-child {
            border-bottom: none;
        }

        .qh-icon {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .qh-icon.up {
            background: #ddf0e5;
            color: #1a7a4a;
        }

        .qh-icon.down {
            background: #fde8e8;
            color: #b33a3a;
        }

        .qh-icon.pending {
            background: #fef0dc;
            color: #b46f1a;
        }

        .qh-content {
            flex: 1;
        }

        .qh-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: #0b1f2e;
        }

        .qh-desc {
            font-size: 0.76rem;
            color: #6b8ba0;
            margin-top: 0.1rem;
        }

        .qh-time {
            font-size: 0.72rem;
            color: #9ab0c2;
            white-space: nowrap;
        }

        /* ===== 消息中心 ===== */
        .msg-empty {
            text-align: center;
            color: #9ab0c2;
            padding: 2.5rem 0;
        }

        .msg-empty i {
            font-size: 2.5rem;
            opacity: 0.5;
            display: block;
            margin-bottom: 0.5rem;
        }

        .msg-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .msg-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 0.6rem;
            border-radius: 12px;
            border-bottom: 1px solid #f0f4f8;
            cursor: pointer;
            transition: background 0.15s;
        }

        .msg-item:hover {
            background: #f8fbfd;
        }

        .msg-item:last-child {
            border-bottom: none;
        }

        .msg-item.unread {
            background: #f0f8fc;
        }

        .msg-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .msg-icon.approved {
            background: #ddf0e5;
            color: #1a7a4a;
        }

        .msg-icon.rejected {
            background: #fde8e8;
            color: #b33a3a;
        }

        .msg-content {
            flex: 1;
            min-width: 0;
        }

        .msg-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #0b1f2e;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .msg-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e87a7a;
            display: inline-block;
        }

        .msg-desc {
            font-size: 0.78rem;
            color: #6b8ba0;
            margin-top: 0.15rem;
        }

        .msg-time {
            font-size: 0.72rem;
            color: #9ab0c2;
            margin-top: 0.2rem;
        }

        .msg-arrow {
            color: #c5dae8;
            font-size: 0.8rem;
        }

        /* ===== 消息详情 ===== */
        .msg-detail-status {
            text-align: center;
            padding: 1rem 0 1.2rem;
            border-bottom: 1px solid #eef2f6;
            margin-bottom: 1rem;
        }

        .msg-detail-icon {
            font-size: 2.5rem;
            margin-bottom: 0.4rem;
        }

        .msg-detail-status.approved .msg-detail-icon {
            color: #1a7a4a;
        }

        .msg-detail-status.rejected .msg-detail-icon {
            color: #b33a3a;
        }

        .msg-detail-title {
            font-size: 1rem;
            font-weight: 600;
            color: #0b1f2e;
        }

        .msg-detail-time {
            font-size: 0.75rem;
            color: #9ab0c2;
            margin-top: 0.3rem;
        }

        .msg-detail-grid {
            margin-bottom: 1rem;
        }

        .msg-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.55rem 0;
            border-bottom: 1px solid #f0f4f8;
            font-size: 0.85rem;
        }

        .msg-detail-row span {
            color: #6b8ba0;
        }

        .msg-detail-row strong {
            color: #0b1f2e;
            font-weight: 600;
        }

        .msg-detail-note {
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            font-size: 0.8rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            line-height: 1.6;
        }

        .msg-detail-note.success {
            background: #e6f3ea;
            color: #1a7a4a;
        }

        .msg-detail-note.danger {
            background: #fde8e8;
            color: #b33a3a;
        }

        /* ===== 顶栏额度按钮 ===== */
        .quota-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.9rem;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #d5e2ec;
            color: #1f6f9e;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .quota-btn:hover {
            background: #f5f8fa;
            border-color: #1f6f9e;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">企业名称</span>
            </div>
            <nav class="nav-menu">
                <div class="nav-item" onclick="location.href='首页.html'">
                    <span class="nav-label"><i class="fas fa-home" style="width:20px;"></i> 首页</span>
                </div>
                <div class="nav-item active" onclick="location.href='存证管理.html'">
                    <span class="nav-label"><i class="fas fa-database" style="width:20px;"></i> 存证管理</span>
                </div>
                <div class="nav-item" onclick="location.href='核验看板.html'">
                    <span class="nav-label"><i class="fas fa-check-double" style="width:20px;"></i> 核验看板</span>
                </div>
                <div class="nav-item" onclick="location.href='凭证管理.html'">
                    <span class="nav-label"><i class="fas fa-file-invoice" style="width:20px;"></i> 凭证管理</span>
                </div>
            </nav>
            <div class="nav-footer">
                <div class="nav-item"
                    onclick="localStorage.removeItem('current_user'); localStorage.removeItem('token'); location.href='登录-贸易商.html'">
                    <span class="nav-label"><i class="fas fa-sign-out-alt" style="width:20px;"></i> 退出</span>
                </div>
            </div>
        </aside>

        <!-- 右侧主内容 -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <span class="page-title">数据上链存证</span>
                </div>
                <div class="top-bar-right">
                    <!-- ✅ 新增：发票额度入口 -->
                    <button class="quota-btn" onclick="openQuotaView()" title="查看发票额度">
                        <i class="fas fa-coins"></i> 额度
                    </button>

                    <!-- ✅ 修改：消息铃铛改为可点击 -->
                    <div class="notifications" onclick="openMessageCenter()" style="cursor:pointer;" title="消息中心">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="notifBadge" style="display:none;">0</span>
                    </div>

                    <button class="help-btn" title="帮助"><i class="fas fa-question-circle"></i></button>
                    <button class="settings-btn" title="设置" onclick="location.href='设置.html'"><i
                            class="fas fa-cog"></i></button>
                </div>
            </header>

            <div class="content-area">
                <div class="upload-card">
                    <div class="card-title">
                        <i class="fas fa-upload"></i> 数据上链存证
                    </div>
                    <div class="card-sub">
                        <i class="fas fa-link" style="margin-right: 6px; color: #2563b0;"></i>
                        选择单据类型，上传文件或填写关键字段，生成链上凭证
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> 选择单据类型 <span class="required">*</span></label>
                        <select id="docType">
                            <option value="交易合同">交易合同</option>
                            <option value="仓储单据">仓储单据</option>
                            <option value="物流轨迹">物流轨迹</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-file-upload"></i> 上传文件</label>
                        <div class="file-upload-area" id="fileDropArea">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <div class="main-hint" id="fileMainHint">点击或拖拽上传文件</div>
                            <div class="sub-hint" id="fileSubHint">支持 PDF、Word、Excel、图片等格式</div>
                            <div id="fileNameDisplay" class="file-name" style="display:none;"></div>
                            <input type="file" id="fileInput" style="display:none;"
                                accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
                        </div>
                    </div>

                    <div style="margin-top: 8px;">
                        <label
                            style="font-size:14px; font-weight:500; color:#1a2a3a; display:block; margin-bottom:10px;">
                            <i class="fas fa-pen"></i> 填写关键字段
                        </label>
                        <div class="form-row">
                            <div class="form-group">
                                <label>合同编号 <span class="required">*</span></label>
                                <input type="text" id="contractNo" placeholder="例如：HT2026-008">
                            </div>
                            <div class="form-group">
                                <label>货物品类 <span class="required">*</span></label>
                                <input type="text" id="goodsType" placeholder="例如：电子元器件">
                            </div>
                            <div class="form-group">
                                <label>数量 <span class="required">*</span></label>
                                <input type="text" id="quantity" placeholder="例如：1000件">
                            </div>
                            <div class="form-group">
                                <label>仓库位置 <span class="required">*</span></label>
                                <input type="text" id="warehouse" placeholder="例如：上海-洋山港">
                            </div>
                        </div>
                        <div class="form-group" style="margin-top: 4px;">
                            <label>备注 / 附加信息</label>
                            <textarea id="remarks" placeholder="可补充物流批次、质检报告编号等"></textarea>
                        </div>
                    </div>

                    <div class="action-bar">
                        <button class="btn btn-primary" id="generateBtn"><i class="fas fa-file-signature"></i>
                            生成凭证</button>
                        <button class="btn btn-success" id="chainBtn" disabled><i class="fas fa-link"></i> 上链存证</button>
                        <button class="btn btn-outline" id="resetBtn"><i class="fas fa-redo"></i> 重置</button>
                    </div>

                    <div class="cert-preview" id="certPreview">
                        <i class="fas fa-certificate"></i>
                        <span>存证凭证号：</span>
                        <span class="cert-id" id="certIdDisplay">--</span>
                        <span class="cert-status" id="certStatus">待生成</span>
                        <span class="cert-time" id="certTimeDisplay">--</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toastContainer"></div>

    <!-- ✅ 新增：发票额度弹窗 -->
    <div class="modal-overlay" id="quotaModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3><i class="fas fa-coins"></i> 发票额度</h3>
                <button class="modal-close" onclick="closeQuotaView()">&times;</button>
            </div>
            <div class="modal-body" id="quotaBody">
                <div style="text-align:center;padding:2rem;color:#9ab0c2;">加载中...</div>
            </div>
        </div>
    </div>

    <!-- ✅ 新增：消息中心弹窗 -->
    <div class="modal-overlay" id="messageModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3><i class="fas fa-bell"></i> 消息中心</h3>
                <button class="modal-close" onclick="closeMessageCenter()">&times;</button>
            </div>
            <div class="modal-body" id="messageBody">
                <div style="text-align:center;padding:2rem;color:#9ab0c2;">加载中...</div>
            </div>
        </div>
    </div>

    <!-- ✅ 新增：消息详情弹窗 -->
    <div class="modal-overlay" id="messageDetailModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3><i class="fas fa-envelope-open-text"></i> 消息详情</h3>
                <button class="modal-close" onclick="closeMessageDetail()">&times;</button>
            </div>
            <div class="modal-body" id="messageDetailBody">
                <div style="text-align:center;padding:2rem;color:#9ab0c2;">加载中...</div>
            </div>
        </div>
    </div>

    <script src="存证管理.js"></script>
</body>

</html>
