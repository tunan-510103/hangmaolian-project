<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>选择身份</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* 主卡片 – 干净、柔和、微光 */
        .selection-card {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 3rem;
            padding: 2.5rem 2rem 3rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.25),
                0 8px 24px -6px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        .selection-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .selection-header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b2b3d;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, #1a3a4a, #0f2c3a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .selection-header p {
            font-size: 1.05rem;
            color: #3e5b6b;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0.02em;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        .option-item {
            background: white;
            border-radius: 2rem;
            padding: 1.8rem 1.2rem 2rem;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 6px 14px rgba(0, 20, 30, 0.06), 0 2px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(209, 224, 235, 0.5);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            will-change: transform, box-shadow, border-color;
            text-decoration: none;
            color: inherit;
        }

        .option-item:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 20px 30px -10px rgba(0, 40, 60, 0.18), 0 8px 18px -6px rgba(0, 20, 30, 0.08);
            border-color: #b2cfdd;
            background: white;
        }

        .option-item:active {
            transform: scale(0.97) translateY(0px);
            transition-duration: 0.08s;
        }

        /* 图标装饰 */
        .option-icon {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            background: linear-gradient(135deg, #e5f0f7, #d3e3ed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            font-size: 2.8rem;
            color: #1b4155;
            transition: background 0.2s, transform 0.2s;
            box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.6), 0 6px 10px -6px rgba(0, 20, 30, 0.1);
        }

        .option-item:hover .option-icon {
            background: linear-gradient(135deg, #d4e7f2, #bdd7e6);
            transform: scale(1.02);
        }

        .option-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0f2f3f;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
        }

        .option-desc {
            font-size: 0.95rem;
            color: #3f5e70;
            opacity: 0.8;
            max-width: 160px;
            margin: 0 auto;
            line-height: 1.4;
            font-weight: 400;
        }

        .option-badge {
            margin-top: 1.2rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #2a5f7a;
            background: rgba(190, 215, 230, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            font-weight: 500;
        }

        .option-item.trader .option-icon {
            background: linear-gradient(135deg, #d9e9f0, #c0dae8);
        }

        .option-item.trader:hover .option-icon {
            background: linear-gradient(135deg, #c6dce9, #afccdd);
        }

        .option-item.admin .option-icon {
            background: linear-gradient(135deg, #dde7f0, #cad8e6);
        }

        .option-item.admin:hover .option-icon {
            background: linear-gradient(135deg, #ccdceb, #b8cde0);
        }

        /* 新增：仓储方 / 物流方 图标色调（沿用同一色系，略有区分） */
        .option-item.warehouse .option-icon {
            background: linear-gradient(135deg, #e0eef2, #c9e0e8);
        }

        .option-item.warehouse:hover .option-icon {
            background: linear-gradient(135deg, #cfe4ec, #b6d4e0);
        }

        .option-item.logistics .option-icon {
            background: linear-gradient(135deg, #e4ecf5, #cfddea);
        }

        .option-item.logistics:hover .option-icon {
            background: linear-gradient(135deg, #d3e0ee, #bccfe2);
        }

        .selection-footer {
            margin-top: 2.8rem;
            text-align: center;
            font-size: 0.9rem;
            color: #4b6d80;
            opacity: 0.65;
            border-top: 1px solid rgba(180, 200, 215, 0.25);
            padding-top: 1.8rem;
            letter-spacing: 0.02em;
        }

        .selection-footer span {
            background: rgba(220, 235, 245, 0.3);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 450;
        }

        /* 高亮状态 (选中) */
        .option-item.selected {
            border-color: #1e5f7a;
            box-shadow: 0 0 0 3px rgba(30, 95, 122, 0.2), 0 12px 24px -12px rgba(0, 40, 60, 0.2);
            background: white;
            transform: translateY(-2px);
        }

        /* 响应式 */
        @media (max-width: 550px) {
            .selection-card {
                padding: 1.8rem 1.2rem 2.2rem;
                border-radius: 2.2rem;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }

            .option-item {
                min-height: 180px;
                padding: 1.5rem 1rem;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem 1rem;
            }

            .option-icon {
                width: 64px;
                height: 64px;
                font-size: 2.2rem;
                margin-bottom: 0.2rem;
                flex-shrink: 0;
            }

            .option-title {
                font-size: 1.4rem;
                width: 100%;
            }

            .option-desc {
                max-width: 220px;
                font-size: 0.9rem;
            }

            .option-badge {
                margin-top: 0.5rem;
                font-size: 0.6rem;
                padding: 0.2rem 0.9rem;
            }

            .selection-header h1 {
                font-size: 1.8rem;
            }

            .selection-footer {
                margin-top: 2rem;
                padding-top: 1.2rem;
                font-size: 0.8rem;
            }
        }

        @media (hover: hover) {
            .option-item:hover {
                transform: translateY(-5px) scale(1.01);
            }
        }

        .option-item:focus-visible {
            outline: 3px solid #1e5f7a;
            outline-offset: 4px;
            border-color: #1e5f7a;
        }

        /* 点击波纹/反馈 (可选) */
        .option-item:active {
            transform: scale(0.96);
        }

        /* 模拟跳转过渡 (点击后闪烁提示) */
        .option-item.jump-triggered {
            animation: jumpPulse 0.4s ease;
        }

        @keyframes jumpPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(30, 95, 122, 0.4);
            }

            50% {
                box-shadow: 0 0 0 12px rgba(30, 95, 122, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(30, 95, 122, 0);
            }
        }

        /* 禁用点击抖动 */
        .option-item {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <div class="selection-card" role="main" aria-label="身份选择界面">

        <div class="selection-header">
            <h1>选择您的身份</h1>
            <p>点击卡片</p>
        </div>

        <!-- 四个核心选项：使用 <a> 标签实现跳转，同时保留高亮 JS 控制 -->
        <div class="options-grid">

            <!-- 贸易商 -->
            <a href="贸易商/登录.html" class="option-item trader" id="traderOption" role="button" tabindex="0"
                aria-label="成为贸易商">
                <div class="option-title">贸易商</div>
                <div class="option-desc">管理商品、订单与交易</div>
                <div class="option-badge">业务中心</div>
            </a>

            <!-- 平台管理员 -->
            <a href="平台管理/登录.html" class="option-item admin" id="adminOption" role="button" tabindex="0"
                aria-label="成为平台管理员">
                <div class="option-title">平台管理员</div>
                <div class="option-desc">系统配置、用户与监管</div>
                <div class="option-badge">管理后台</div>
            </a>

            <!-- 仓储方 -->
            <a href="仓储方/仓储方申请.html" class="option-item warehouse" id="warehouseOption" role="button" tabindex="0"
                aria-label="成为仓储方">
                <div class="option-title">仓储方</div>
                <div class="option-desc">仓单、库存与出入库</div>
                <div class="option-badge">仓储服务</div>
            </a>

            <!-- 物流方 -->
            <a href="物流方/物流方申请.html" class="option-item logistics" id="logisticsOption" role="button" tabindex="0"
                aria-label="成为物流方">
                <div class="option-title">物流方</div>
                <div class="option-desc">运输、配送与签收</div>
                <div class="option-badge">物流服务</div>
            </a>

        </div>

        <div class="selection-footer">
            <span>点击卡片后进入</span>
        </div>

    </div>

    <script>
        (function () {
            "use strict";

            const traderEl = document.getElementById('traderOption');
            const adminEl = document.getElementById('adminOption');
            const warehouseEl = document.getElementById('warehouseOption');
            const logisticsEl = document.getElementById('logisticsOption');
            const options = [traderEl, adminEl, warehouseEl, logisticsEl];

            // 清除所有高亮
            function clearSelected() {
                options.forEach(opt => {
                    if (opt) opt.classList.remove('selected');
                });
            }

            // 设置高亮 (移除其他，高亮当前)
            function setSelected(el) {
                clearSelected();
                if (el) el.classList.add('selected');
            }

            // 延迟跳转：先高亮 + 动画，再跳转
            function handleClickWithDelay(e) {
                e.preventDefault(); // 阻止默认跳转
                const target = e.currentTarget;
                const href = target.getAttribute('href');

                // 高亮当前
                setSelected(target);

                // 添加动画
                target.classList.add('jump-triggered');
                setTimeout(() => {
                    target.classList.remove('jump-triggered');
                }, 400);

                console.log(`[跳转] 高亮后前往: ${href}`);

                // 延迟 300ms 跳转，让高亮可见
                setTimeout(() => {
                    if (href) {
                        window.location.href = href;
                    } else {
                        alert('未设置跳转链接');
                    }
                }, 300);
            }

            function handleKeydownWithDelay(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();  // 阻止空格滚动
                    const target = e.currentTarget;
                    target.click(); // 会触发 handleClickWithDelay
                }
            }

            // 绑定事件
            options.forEach(option => {
                if (!option) return;
                option.addEventListener('click', handleClickWithDelay);
                option.addEventListener('keydown', handleKeydownWithDelay);
                option.addEventListener('touchstart', function () {
                    // 仅用于触感，无操作
                }, { passive: true });
            });

            // 默认高亮贸易商 (初始状态)
            setTimeout(() => {
                clearSelected();
                if (traderEl) {
                    traderEl.classList.add('selected');
                    console.log('[初始化] 默认高亮: 贸易商');
                }
            }, 10);

            // 如果 URL 带参数 highlight=xxx，则高亮对应卡片
            const highlight = new URLSearchParams(window.location.search).get('highlight');
            if (highlight === 'admin' && adminEl) {
                setTimeout(() => setSelected(adminEl), 20);
            } else if (highlight === 'warehouse' && warehouseEl) {
                setTimeout(() => setSelected(warehouseEl), 20);
            } else if (highlight === 'logistics' && logisticsEl) {
                setTimeout(() => setSelected(logisticsEl), 20);
            } else if (highlight === 'trader' && traderEl) {
                setTimeout(() => setSelected(traderEl), 20);
            }

            // 暴露方法 (调试用)
            window.clearSelection = clearSelected;
            window.setSelected = setSelected;

            console.log('身份选择 + 跳转已启动 (四卡片，点击后延迟跳转，高亮保留)');
        })();
    </script>

</body>

</html>
